[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# OpenZeppelin 5.4 usa mcopy. La C-Chain de Avalanche admite Cancun desde Etna (ACP-131).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 256
depth = 128

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
